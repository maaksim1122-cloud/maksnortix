<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дякуємо! Nortix Talk</title>
<meta name="robots" content="noindex">

<!-- ВСТАВТЕ СЮДИ тег Google Ads (gtag.js) і фрагмент події конверсії,
     який Google покаже у майстрі налаштування. Він має бути саме на цій сторінці. -->

<style>
  :root{
    --bg:#0b1020; --surface:#141b33; --line:#25305a;
    --text:#f1f4ff; --muted:#9aa4c7; --cyan:#6fe3f0; --green:#8be28b; --on-green:#0b2a14;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main{width:100%; max-width:440px; text-align:center}
  .logo{
    width:96px; height:96px; margin:0 auto 28px; border-radius:50%;
    background:var(--surface); border:1px solid var(--line);
    display:grid; place-items:center;
  }
  h1{font-size:30px; line-height:1.15; margin:0 0 12px; letter-spacing:-.01em}
  p{margin:0 0 28px; color:var(--muted)}
  .btn{
    display:block; padding:16px 24px; border-radius:999px;
    background:var(--green); color:var(--on-green);
    font-weight:700; font-size:18px; text-decoration:none;
  }
  .btn:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
  .back{display:inline-block; margin-top:22px; color:var(--cyan); text-decoration:none}
  .back:hover{text-decoration:underline}
  @media (prefers-color-scheme:light){
    :root{--bg:#f4f7ff; --surface:#fff; --line:#d5ddf5; --text:#0f1730; --muted:#4d5a85; --cyan:#0a6a78}
  }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none">
      <path d="M17 24v-6a9 9 0 0 1 18 0v6" stroke="#6fe3f0" stroke-width="4" stroke-linecap="round"/>
      <path d="M10 26h32v18a3 3 0 0 1-3 3H13a3 3 0 0 1-3-3V26Z" fill="#6fe3f0"/>
      <path d="M12 28l14 10 14-10" stroke="#141b33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Дякуємо! Nortix Talk чекає на вас</h1>
  <p>Встановіть застосунок і увійдіть за поштою або номером телефону. Повідомлення та дзвінки захищені наскрізним шифруванням.</p>

  <!-- TODO: замініть "#" на посилання на Google Play, коли застосунок буде опубліковано -->
  <a class="btn" href="#">Завантажити Nortix Talk</a>
  <a class="back" href="/">Повернутися на сайт</a>
</main>
</body>
</htm
